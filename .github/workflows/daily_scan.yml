name: Daily Shariah Trade Alert

on:
  schedule:
    - cron: "40 19,20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 50-stock scanner & send Discord alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IBKR_CASH_BALANCE: ${{ secrets.IBKR_CASH_BALANCE }}
        run: python discord_shariah_bot.py

      - name: Save bot position state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shariah_bot_state.json || true
          git diff --staged --quiet || git commit -m "Update daily position state"
          git push
